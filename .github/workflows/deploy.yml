# Cloudflare Pages deployment was consistently failing because this repo has no
# configured Cloudflare credentials. GitHub Pages already deploys successfully.
# Keep this optional migration path manual to avoid red builds on every change.
name: Deploy to Cloudflare Pages (optional manual)
on:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify Cloudflare credentials
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "Missing Cloudflare deployment credentials. GitHub Pages is the active publish path."
            exit 1
          fi
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=carolina-delacerda --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
